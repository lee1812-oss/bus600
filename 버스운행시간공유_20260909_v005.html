<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a26">
<title>600번 운행시간</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="600 운행시간">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#0f1a26;        /* 새벽 배차 시간대에 눈부시지 않은 남색 */
    --panel:#17273a;
    --line:#26384d;
    --text:#f2f5f8;
    --dim:#8fa3b8;
    --blue:#2d7fe0;      /* 서울 간선버스 파랑 */
    --blue-deep:#1f63b6;
    --bubble:#3c4a5a;
    --ok:#39c27a;
    --danger:#e0574f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:17px;line-height:1.4}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(112px + env(safe-area-inset-bottom));}
  .wrap{max-width:480px;margin:0 auto;padding:14px 16px 0}

  header{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 16px}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
  header h1 b{color:var(--blue);font-size:26px;margin-right:6px}
  header .date{color:var(--dim);font-size:14px}

  /* 미리보기: 카톡에 붙을 모습 그대로 */
  .preview{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:18px}
  .bubble{background:var(--bubble);border-radius:18px 18px 18px 4px;padding:14px 18px;
    font-size:24px;font-weight:600;line-height:1.35;white-space:pre-line;min-width:150px;
    font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .bubble.empty{color:var(--dim);font-weight:400;font-size:16px}
  .preview .hint{color:var(--dim);font-size:13px;padding-left:4px}

  section{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:center}
  label{display:block;color:var(--dim);font-size:14px;margin-bottom:8px}
  input{width:100%;background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:2px;
    outline:none;font-family:inherit}
  input:focus{border-color:var(--blue)}
  input::placeholder{color:#4e627a;font-weight:400;letter-spacing:1px}
  button{font-family:inherit;border:0;border-radius:12px;cursor:pointer;font-weight:700}
  .add{background:var(--blue);color:#fff;font-size:20px;padding:0 22px;height:58px;flex:0 0 auto}
  .add:active{background:var(--blue-deep)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .chip.on{border-color:var(--blue);color:var(--blue)}
  .chip.tag{color:var(--dim);font-weight:500}
  .chip.tag.on{color:var(--text);border-color:var(--dim);background:var(--line)}
  .chip.tag:disabled{opacity:.35}
  .chip.next{color:var(--dim);font-weight:500;border-style:dashed}
  .chip[hidden]{display:none}

  .times{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .times:empty{display:none}
  .time{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;
    font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px;color:var(--text)}
  .time span{color:var(--dim);font-size:18px;font-weight:400;line-height:1;padding:6px 4px 6px 8px;margin:-6px -4px -6px 0}
  .time:active{border-color:var(--danger)}

  .small{display:flex;gap:8px;margin-top:2px}
  .small button{flex:1;background:transparent;color:var(--dim);border:1.5px solid var(--line);padding:11px;font-size:15px;font-weight:600}
  .small button:active{color:var(--text);border-color:var(--dim)}

  .history{margin-top:4px}
  .history h2{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600}
  .hist{width:100%;text-align:left;background:var(--panel);color:var(--text);padding:12px 14px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;font-weight:500;font-variant-numeric:tabular-nums}
  .hist .d{color:var(--dim);font-size:14px}
  .hist .t{font-size:16px}
  .hist:active{background:#1e3146}

  /* 하단 고정 복사 버튼 */
  .dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .dock .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
  .copy{flex:1;height:64px;font-size:20px;background:var(--blue);color:#fff;border-radius:16px;
    box-shadow:0 8px 24px rgba(45,127,224,.35);transition:background .15s}
  .copy:active{background:var(--blue-deep)}
  .copy.done{background:var(--ok);box-shadow:0 8px 24px rgba(57,194,122,.3)}
  .copy:disabled{background:#2b3c50;color:#6c8299;box-shadow:none}
  .share{width:64px;height:64px;font-size:26px;background:var(--panel);color:var(--text);border:1.5px solid var(--line);border-radius:16px}
  .share[hidden]{display:none}

  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
    background:#e8eef5;color:#0f1a26;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;
    opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>600</b>운행시간</h1>
    <div class="date" id="today"></div>
  </header>

  <div class="preview">
    <div class="bubble empty" id="bubble">차량번호와 출발 시각을 넣으면 여기에 보입니다</div>
    <div class="hint">이 내용이 그대로 복사됩니다</div>
  </div>

  <section>
    <label for="car">차량번호</label>
    <input id="car" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="3240" autocomplete="off">
    <div class="chips" id="carChips"></div>
    <div class="chips"><button class="chip tag" id="tagSpare">예비차</button><button class="chip tag" id="tagLast">막차</button></div>
  </section>

  <section>
    <label for="time">출발 시각 <span style="opacity:.7">— 숫자만 (656 → 06:56) · 넣은 시각을 누르면 고칠 수 있음</span></label>
    <div class="row">
      <input id="time" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="06:56" autocomplete="off" enterkeyhint="done">
      <button class="add" id="addBtn">추가</button>
    </div>
    <div class="times" id="times"></div>
    <div class="chips"><button class="chip next" id="next" hidden></button></div>
  </section>

  <div class="small">
    <button id="clearTimes">시각 지우기</button>
    <button id="newDay">새로 시작</button>
  </div>

  <div class="history" id="history"></div>
</div>

<div class="dock"><div class="in">
  <button class="copy" id="copyBtn" disabled>복사 후 카톡 열기</button>
  <button class="share" id="shareBtn" hidden title="공유">⇪</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY='bus600_v1';
  const $=id=>document.getElementById(id);
  const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

  // 2025-05~2026-09 카톡 기록 기준 가장 자주 탄 차량 (많이 쓴 순)
  const DEFAULT_CARS=['6662','3222','3268','3240','6757','6789','6791','6719','6676','6670'];
  const GAP=203; // 회차 간격 중앙값(분) ≈ 3시간 23분 — 다음 회차 예상에만 사용

  let st=load();
  function load(){
    try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cur){s.carCount=s.carCount||{};s.cur.tags=s.cur.tags||{};return s;}}catch(e){}
    return {cur:{date:todayStr(),car:'',times:[],tags:{}},recentCars:[],carCount:{},history:[]};
  }
  function carChips(){
    const all=[...new Set([...st.recentCars,...DEFAULT_CARS])];
    return all.sort((a,b)=>(st.carCount[b]||0)-(st.carCount[a]||0)).slice(0,10);
  }
  function nextGuess(){
    if(!st.cur.times.length)return '';
    const [h,m]=st.cur.times[st.cur.times.length-1].split(':').map(Number);
    const n=(h*60+m+GAP)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(st));}

  // 날짜가 바뀌었으면 어제 기록을 이력으로 넘기고 시각만 비움
  if(st.cur.date!==todayStr()){
    archive();
    st.cur={date:todayStr(),car:st.cur.car,times:[],tags:{}};
    save();
  }
  function archive(){
    if(!st.cur.car||!st.cur.times.length)return;
    st.history=st.history.filter(h=>h.date!==st.cur.date);
    st.history.unshift({date:st.cur.date,car:st.cur.car,times:st.cur.times.slice(),tags:Object.assign({},st.cur.tags)});
    st.history=st.history.slice(0,10);
  }

  function text(){
    if(!st.cur.car||!st.cur.times.length)return '';
    const ts=st.cur.times.slice();
    if(st.cur.tags.last)ts[ts.length-1]+=' 막차';
    return '600번 '+st.cur.car+(st.cur.tags.spare?' 예비차':'')+'\n'+ts.join('\n');
  }

  function fmtTime(raw){
    const d=raw.replace(/\D/g,'');
    if(d.length<3||d.length>4)return null;
    const h=d.length===3?d.slice(0,1):d.slice(0,2), m=d.slice(-2);
    if(+h>23||+m>59)return null;
    return h.padStart(2,'0')+':'+m;
  }

  function render(){
    const d=new Date();
    $('today').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+['일','월','화','수','목','금','토'][d.getDay()]+'요일';
    const t=text();
    const b=$('bubble');
    if(t){b.textContent=t;b.classList.remove('empty');}
    else{b.textContent='차량번호와 출발 시각을 넣으면 여기에 보입니다';b.classList.add('empty');}
    $('copyBtn').disabled=!t;
    $('shareBtn').hidden=!(navigator.share&&t);
    if($('car').value!==st.cur.car)$('car').value=st.cur.car;

    $('carChips').innerHTML=carChips().map(c=>'<button class="chip'+(c===st.cur.car?' on':'')+'" data-car="'+c+'">'+c+'</button>').join('');
    $('tagSpare').classList.toggle('on',!!st.cur.tags.spare);
    $('tagLast').classList.toggle('on',!!st.cur.tags.last);
    $('tagLast').disabled=!st.cur.times.length;
    const g=nextGuess();
    $('next').hidden=!g||st.cur.times.length>=4;
    if(g){$('next').textContent='다음 회차 예상 '+g+' (+3:23)';$('next').dataset.t=g;}
    $('times').innerHTML=st.cur.times.map(t=>'<button class="time" data-t="'+t+'">'+t+'<span class="del">✕</span></button>').join('');

    const h=st.history.filter(x=>x.date!==st.cur.date);
    $('history').innerHTML=h.length?'<h2>지난 기록 — 누르면 불러옵니다</h2>'+h.map(x=>{
      const [y,m,dd]=x.date.split('-');
      return '<button class="hist" data-date="'+x.date+'"><span class="d">'+(+m)+'/'+(+dd)+' · '+x.car+'</span><span class="t">'+x.times.join('  ')+'</span></button>';
    }).join(''):'';
  }

  function setCar(v){
    st.cur.car=v;
    if(v.length===4){st.recentCars=[v,...st.recentCars.filter(c=>c!==v)].slice(0,10);}
    save();render();
  }
  $('car').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);setCar(e.target.value);
    if(e.target.value.length===4)$('time').focus();});
  $('carChips').addEventListener('click',e=>{const c=e.target.closest('[data-car]');if(c){setCar(c.dataset.car);}});

  function addTime(){
    const v=fmtTime($('time').value);
    if(!v){toast('시각을 3~4자리 숫자로 넣어주세요 (예: 656, 1022)');$('time').select();return;}
    if(!st.cur.times.includes(v))st.cur.times.push(v);
    st.cur.times.sort();
    $('time').value='';save();render();$('time').focus();
  }
  $('addBtn').addEventListener('click',addTime);
  $('time').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTime();}});
  $('time').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^\d:]/g,'').slice(0,5);});
  $('times').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;
    st.cur.times=st.cur.times.filter(t=>t!==b.dataset.t);
    if(!st.cur.times.length)st.cur.tags.last=false;
    save();render();
    if(!e.target.closest('.del')){ // 시각 부분을 누름 → 수정
      const i=$('time');i.value=b.dataset.t;i.focus();i.setSelectionRange(3,5);toast('고친 뒤 추가를 누르세요');
    }});

  $('clearTimes').addEventListener('click',()=>{st.cur.times=[];save();render();});
  $('newDay').addEventListener('click',()=>{archive();st.cur={date:todayStr(),car:'',times:[],tags:{}};save();render();$('car').focus();});
  $('clearTimes').addEventListener('click',()=>{st.cur.tags.last=false;});
  $('tagSpare').addEventListener('click',()=>{st.cur.tags.spare=!st.cur.tags.spare;save();render();});
  $('tagLast').addEventListener('click',()=>{st.cur.tags.last=!st.cur.tags.last;save();render();});
  $('next').addEventListener('click',e=>{$('time').value=e.target.dataset.t;$('time').focus();$('time').setSelectionRange(3,5);});

  $('history').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(!b)return;
    const h=st.history.find(x=>x.date===b.dataset.date);if(!h)return;
    st.cur.car=h.car;st.cur.times=h.times.slice();st.cur.tags=Object.assign({},h.tags||{});save();render();toast('불러왔습니다');});

  async function copy(){
    const t=text();if(!t)return;
    let ok=false;
    try{await navigator.clipboard.writeText(t);ok=true;}
    catch(e){
      const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      try{ok=document.execCommand('copy');}catch(_){}
      document.body.removeChild(ta);
    }
    const b=$('copyBtn');
    if(ok){if(st.cur.car)st.carCount[st.cur.car]=(st.carCount[st.cur.car]||0)+1;archive();save();b.textContent='복사됨 — 카톡 여는 중';b.classList.add('done');
      setTimeout(()=>{location.href='kakaotalk://';},350);
      setTimeout(()=>{b.textContent='복사 후 카톡 열기';b.classList.remove('done');},2500);}
    else toast('복사에 실패했습니다. 말풍선을 길게 눌러 복사하세요');
  }
  $('copyBtn').addEventListener('click',copy);
  $('shareBtn').addEventListener('click',async()=>{try{archive();save();await navigator.share({text:text()});}catch(e){}});

  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

  render();
  if(!st.cur.car)$('car').focus();
})();
</script>
</body>
</html>
